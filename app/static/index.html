<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Extractor — Ekstrak Tabel dari PDF & Gambar</title>
    <meta name="description" content="Konversi tabel dari PDF dan gambar ke format Excel (.xlsx) atau CSV (.csv) secara otomatis. Self-hosted, privasi terjaga.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7',
                            400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857',
                            800: '#065f46', 900: '#064e3b', 950: '#022c22',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #6b7280; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #4b5563; }

        /* Drag-over pulse */
        .dropzone-active {
            animation: dropzonePulse 1s ease-in-out infinite alternate;
        }
        @keyframes dropzonePulse {
            from { border-color: #10b981; background-color: rgba(16,185,129,0.05); }
            to   { border-color: #34d399; background-color: rgba(16,185,129,0.12); }
        }

        /* Spin animation */
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }

        /* Fade in */
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease-out; }

        /* Toast slide */
        @keyframes toastSlide { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }
        .toast-enter { animation: toastSlide 0.3s ease-out; }
        @keyframes toastOut { from { transform:translateX(0); opacity:1; } to { transform:translateX(100%); opacity:0; } }
        .toast-exit { animation: toastOut 0.3s ease-in forwards; }

        /* Table preview styles */
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .preview-table th {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .dark .preview-table th {
            background: #1e293b;
            color: #e2e8f0;
            border-bottom: 2px solid #334155;
        }
        .preview-table th {
            background: #f1f5f9;
            color: #334155;
            border-bottom: 2px solid #cbd5e1;
            padding: 8px 12px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }
        .preview-table td {
            padding: 6px 12px;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }
        .dark .preview-table td {
            border-bottom-color: #334155;
        }
        .preview-table tbody tr:hover {
            background: rgba(16,185,129,0.06);
        }
        .dark .preview-table tbody tr:hover {
            background: rgba(16,185,129,0.1);
        }

        /* Tab active */
        .tab-btn.active {
            color: #10b981;
            border-bottom-color: #10b981;
            background: rgba(16,185,129,0.08);
        }

        /* Search highlight */
        .highlight-match {
            background: rgba(250,204,21,0.4);
            border-radius: 2px;
            padding: 0 1px;
        }
        .dark .highlight-match {
            background: rgba(250,204,21,0.25);
        }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-200 min-h-screen font-sans transition-colors duration-300">

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Header -->
    <header class="sticky top-0 z-40 backdrop-blur-xl bg-white/80 dark:bg-gray-950/80 border-b border-gray-200 dark:border-gray-800">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center shadow-lg shadow-brand-500/20">
                    <i data-lucide="table-2" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-brand-500 to-brand-700 bg-clip-text text-transparent">Table Extractor</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400 -mt-0.5 hidden sm:block">Ekstrak Tabel → Excel / CSV</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button id="btnThemeToggle" title="Toggle tema"
                    class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">

        <!-- ============================================================= -->
        <!-- State: IDLE — Upload Area                                     -->
        <!-- ============================================================= -->
        <section id="stateIdle" class="fade-in">
            <!-- Dropzone -->
            <div id="dropzone"
                class="relative border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-2xl p-12 text-center cursor-pointer
                       hover:border-brand-400 dark:hover:border-brand-500 transition-all duration-300 group
                       bg-white dark:bg-gray-900/50">
                <input type="file" id="fileInput" class="hidden"
                    accept=".pdf,.png,.jpg,.jpeg,.webp,application/pdf,image/png,image/jpeg,image/webp">

                <div class="flex flex-col items-center gap-4">
                    <div class="w-16 h-16 rounded-2xl bg-brand-50 dark:bg-brand-950/50 flex items-center justify-center
                                group-hover:scale-110 transition-transform duration-300">
                        <i data-lucide="upload-cloud" class="w-8 h-8 text-brand-500"></i>
                    </div>
                    <div>
                        <p class="text-lg font-semibold text-gray-700 dark:text-gray-200">
                            Seret & lepas file di sini
                        </p>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                            atau <span class="text-brand-500 font-medium underline underline-offset-2">pilih file</span> dari komputer
                        </p>
                    </div>
                    <div class="flex flex-wrap justify-center gap-2 mt-2">
                        <span class="px-2.5 py-1 text-xs font-medium rounded-full bg-red-50 text-red-600 dark:bg-red-950/50 dark:text-red-400">PDF</span>
                        <span class="px-2.5 py-1 text-xs font-medium rounded-full bg-blue-50 text-blue-600 dark:bg-blue-950/50 dark:text-blue-400">PNG</span>
                        <span class="px-2.5 py-1 text-xs font-medium rounded-full bg-amber-50 text-amber-600 dark:bg-amber-950/50 dark:text-amber-400">JPG</span>
                        <span class="px-2.5 py-1 text-xs font-medium rounded-full bg-purple-50 text-purple-600 dark:bg-purple-950/50 dark:text-purple-400">WEBP</span>
                    </div>
                    <p class="text-xs text-gray-400 dark:text-gray-500">Maksimal 50 MB</p>
                </div>
            </div>

            <!-- File selected info -->
            <div id="fileInfo" class="hidden mt-4 fade-in">
                <div class="flex items-center justify-between bg-white dark:bg-gray-900 rounded-xl p-4 border border-gray-200 dark:border-gray-800 shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-brand-50 dark:bg-brand-950/50 flex items-center justify-center">
                            <i data-lucide="file-text" class="w-5 h-5 text-brand-500" id="fileIcon"></i>
                        </div>
                        <div>
                            <p id="selectedFileName" class="font-medium text-sm truncate max-w-xs"></p>
                            <p id="selectedFileSize" class="text-xs text-gray-500 dark:text-gray-400"></p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="btnRemoveFile" title="Hapus file"
                            class="p-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/50 text-gray-400 hover:text-red-500 transition-colors">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <button id="btnConvert"
                    class="w-full mt-4 py-3 px-6 rounded-xl font-semibold text-white
                           bg-gradient-to-r from-brand-500 to-brand-600
                           hover:from-brand-600 hover:to-brand-700
                           shadow-lg shadow-brand-500/25 hover:shadow-brand-500/40
                           transition-all duration-300 active:scale-[0.98]
                           flex items-center justify-center gap-2">
                    <i data-lucide="scan-line" class="w-5 h-5"></i>
                    Ekstrak Tabel
                </button>
            </div>
        </section>

        <!-- ============================================================= -->
        <!-- State: LOADING                                                -->
        <!-- ============================================================= -->
        <section id="stateLoading" class="hidden fade-in">
            <div class="flex flex-col items-center justify-center py-20 gap-6">
                <div class="relative">
                    <div class="w-16 h-16 rounded-full border-4 border-brand-200 dark:border-brand-900 border-t-brand-500 animate-spin"></div>
                </div>
                <div class="text-center">
                    <p class="font-semibold text-lg">Mengekstrak tabel...</p>
                    <p id="loadingDetail" class="text-sm text-gray-500 dark:text-gray-400 mt-1">Memproses dokumen...</p>
                </div>
            </div>
        </section>

        <!-- ============================================================= -->
        <!-- State: RESULT — Table Preview                                 -->
        <!-- ============================================================= -->
        <section id="stateResult" class="hidden fade-in">
            <!-- Stats Bar -->
            <div id="statsBar" class="flex flex-wrap items-center gap-4 mb-4 px-1">
                <div class="flex items-center gap-1.5 text-sm text-gray-600 dark:text-gray-400">
                    <i data-lucide="file-text" class="w-4 h-4"></i>
                    <span id="resultFilename" class="font-medium"></span>
                </div>
                <div class="flex items-center gap-1.5 text-sm text-gray-600 dark:text-gray-400">
                    <i data-lucide="table-2" class="w-4 h-4"></i>
                    <span id="statTables"></span>
                </div>
                <div class="flex items-center gap-1.5 text-sm text-gray-600 dark:text-gray-400">
                    <i data-lucide="rows-3" class="w-4 h-4"></i>
                    <span id="statRows"></span>
                </div>
                <div class="flex items-center gap-1.5 text-sm text-gray-600 dark:text-gray-400">
                    <i data-lucide="columns-3" class="w-4 h-4"></i>
                    <span id="statCols"></span>
                </div>
            </div>

            <!-- Action Bar -->
            <div class="flex flex-wrap items-center gap-2 mb-4">
                <button id="btnDownloadXlsx"
                    class="px-4 py-2 rounded-lg font-medium text-sm text-white
                           bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700
                           shadow-md shadow-brand-500/20 hover:shadow-brand-500/30
                           transition-all duration-200 flex items-center gap-2 active:scale-95">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                    Download Excel
                </button>
                <button id="btnDownloadCsv"
                    class="px-4 py-2 rounded-lg font-medium text-sm
                           bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700
                           hover:bg-gray-50 dark:hover:bg-gray-750 text-gray-700 dark:text-gray-300
                           transition-all duration-200 flex items-center gap-2 active:scale-95">
                    <i data-lucide="file-text" class="w-4 h-4"></i>
                    Download CSV
                </button>
                <button id="btnCopyTsv"
                    class="px-4 py-2 rounded-lg font-medium text-sm
                           bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700
                           hover:bg-gray-50 dark:hover:bg-gray-750 text-gray-700 dark:text-gray-300
                           transition-all duration-200 flex items-center gap-2 active:scale-95">
                    <i data-lucide="clipboard-copy" class="w-4 h-4"></i>
                    <span>Copy Tabel</span>
                </button>

                <div class="flex-1"></div>

                <button id="btnReset"
                    class="px-4 py-2 rounded-lg font-medium text-sm
                           bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700
                           hover:bg-gray-50 dark:hover:bg-gray-750 text-gray-700 dark:text-gray-300
                           transition-all duration-200 flex items-center gap-2 active:scale-95">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    Konversi Baru
                </button>
            </div>

            <!-- Search -->
            <div class="relative mb-4">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                <input type="text" id="searchInput" placeholder="Cari dalam tabel..."
                    class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700
                           bg-white dark:bg-gray-900 text-sm
                           focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500
                           transition-all duration-200 outline-none placeholder:text-gray-400">
                <button id="btnClearSearch" class="hidden absolute right-3 top-1/2 -translate-y-1/2 p-1 rounded hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-400">
                    <i data-lucide="x" class="w-3 h-3"></i>
                </button>
            </div>

            <!-- Tab Navigation -->
            <div id="tabNav" class="flex gap-1 overflow-x-auto pb-1 mb-0 border-b border-gray-200 dark:border-gray-800">
                <!-- Tabs injected dynamically -->
            </div>

            <!-- Table Container -->
            <div id="tableContainer" class="bg-white dark:bg-gray-900 rounded-b-xl border border-t-0 border-gray-200 dark:border-gray-800 overflow-auto max-h-[60vh] shadow-sm">
                <!-- Table rendered dynamically -->
            </div>

            <!-- Table Info Bar -->
            <div id="tableInfoBar" class="flex items-center justify-between mt-2 px-1 text-xs text-gray-500 dark:text-gray-400">
                <span id="tableInfoText"></span>
                <span id="searchResultText" class="hidden"></span>
            </div>
        </section>

        <!-- ============================================================= -->
        <!-- State: ERROR                                                  -->
        <!-- ============================================================= -->
        <section id="stateError" class="hidden fade-in">
            <div class="flex flex-col items-center justify-center py-16 gap-4">
                <div class="w-16 h-16 rounded-full bg-red-50 dark:bg-red-950/50 flex items-center justify-center">
                    <i data-lucide="alert-triangle" class="w-8 h-8 text-red-500"></i>
                </div>
                <div class="text-center max-w-md">
                    <p class="font-semibold text-lg text-red-600 dark:text-red-400">Terjadi Kesalahan</p>
                    <p id="errorMessage" class="text-sm text-gray-600 dark:text-gray-400 mt-2"></p>
                </div>
                <button id="btnRetry"
                    class="mt-2 px-6 py-2.5 rounded-xl font-medium text-sm text-white
                           bg-gradient-to-r from-brand-500 to-brand-600
                           hover:from-brand-600 hover:to-brand-700
                           shadow-lg shadow-brand-500/25
                           transition-all duration-300 flex items-center gap-2 active:scale-95">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    Coba Lagi
                </button>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-6 text-center text-xs text-gray-400 dark:text-gray-600">
        <p>Table Extractor v1.0.0 — Self-hosted Table Extractor</p>
    </footer>

    <!-- ================================================================= -->
    <!-- JavaScript                                                        -->
    <!-- ================================================================= -->
    <script>
        // =====================================================================
        // DOM Elements
        // =====================================================================
        const $ = s => document.querySelector(s);
        const $$ = s => document.querySelectorAll(s);

        const els = {
            // States
            stateIdle:    $('#stateIdle'),
            stateLoading: $('#stateLoading'),
            stateResult:  $('#stateResult'),
            stateError:   $('#stateError'),

            // Upload
            dropzone:      $('#dropzone'),
            fileInput:     $('#fileInput'),
            fileInfo:      $('#fileInfo'),
            selectedFileName: $('#selectedFileName'),
            selectedFileSize: $('#selectedFileSize'),
            btnRemoveFile: $('#btnRemoveFile'),
            btnConvert:    $('#btnConvert'),

            // Loading
            loadingDetail: $('#loadingDetail'),

            // Result
            statsBar:        $('#statsBar'),
            resultFilename:  $('#resultFilename'),
            statTables:      $('#statTables'),
            statRows:        $('#statRows'),
            statCols:        $('#statCols'),
            tabNav:          $('#tabNav'),
            tableContainer:  $('#tableContainer'),
            tableInfoBar:    $('#tableInfoBar'),
            tableInfoText:   $('#tableInfoText'),
            searchInput:     $('#searchInput'),
            btnClearSearch:  $('#btnClearSearch'),
            searchResultText: $('#searchResultText'),
            btnDownloadXlsx: $('#btnDownloadXlsx'),
            btnDownloadCsv:  $('#btnDownloadCsv'),
            btnCopyTsv:      $('#btnCopyTsv'),
            btnReset:        $('#btnReset'),

            // Error
            errorMessage: $('#errorMessage'),
            btnRetry:     $('#btnRetry'),
        };

        // =====================================================================
        // State Management
        // =====================================================================
        let currentFile = null;
        let resultData = null;
        let activeTabIndex = 0;

        function switchState(state) {
            els.stateIdle.classList.toggle('hidden', state !== 'idle');
            els.stateLoading.classList.toggle('hidden', state !== 'loading');
            els.stateResult.classList.toggle('hidden', state !== 'result');
            els.stateError.classList.toggle('hidden', state !== 'error');
        }

        function resetToIdle() {
            currentFile = null;
            resultData = null;
            activeTabIndex = 0;
            els.fileInfo.classList.add('hidden');
            els.fileInput.value = '';
            els.searchInput.value = '';
            els.btnClearSearch.classList.add('hidden');
            els.searchResultText.classList.add('hidden');
            switchState('idle');
        }

        // =====================================================================
        // Utilities
        // =====================================================================
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function formatNumber(n) {
            return n.toLocaleString('id-ID');
        }

        // =====================================================================
        // Toast System
        // =====================================================================
        function showToast(message, type = 'info', duration = 4000) {
            const container = $('#toastContainer');
            const toast = document.createElement('div');

            const colors = {
                success: 'bg-brand-500 text-white',
                error:   'bg-red-500 text-white',
                info:    'bg-gray-800 dark:bg-gray-700 text-white',
            };

            const icons = {
                success: 'check-circle',
                error:   'alert-circle',
                info:    'info',
            };

            toast.className = `pointer-events-auto flex items-center gap-2 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium ${colors[type]} toast-enter`;
            toast.innerHTML = `<i data-lucide="${icons[type]}" class="w-4 h-4 shrink-0"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons({ nodes: [toast] });

            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                toast.addEventListener('animationend', () => toast.remove());
            }, duration);
        }

        // =====================================================================
        // Theme Toggle
        // =====================================================================
        const btnTheme = $('#btnThemeToggle');
        const storedTheme = localStorage.getItem('table-extractor-theme');
        if (storedTheme === 'light') {
            document.documentElement.classList.remove('dark');
        }

        btnTheme.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('table-extractor-theme', isDark ? 'dark' : 'light');
            lucide.createIcons();
        });

        // =====================================================================
        // File Handling
        // =====================================================================
        function handleFileSelect(file) {
            if (!file) return;

            const ext = '.' + file.name.split('.').pop().toLowerCase();
            const allowedExts = ['.pdf', '.png', '.jpg', '.jpeg', '.webp'];

            if (!allowedExts.includes(ext)) {
                showToast(`Format file "${ext}" tidak didukung. Gunakan PDF, PNG, JPG, atau WEBP.`, 'error');
                return;
            }

            if (file.size > 50 * 1024 * 1024) {
                showToast('Ukuran file melebihi batas 50 MB.', 'error');
                return;
            }

            currentFile = file;
            els.selectedFileName.textContent = file.name;
            els.selectedFileSize.textContent = formatFileSize(file.size);
            els.fileInfo.classList.remove('hidden');
            lucide.createIcons({ nodes: [els.fileInfo] });
        }

        // Drag & Drop
        els.dropzone.addEventListener('click', () => els.fileInput.click());

        els.dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            els.dropzone.classList.add('dropzone-active');
        });
        els.dropzone.addEventListener('dragleave', () => {
            els.dropzone.classList.remove('dropzone-active');
        });
        els.dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            els.dropzone.classList.remove('dropzone-active');
            if (e.dataTransfer.files.length > 0) handleFileSelect(e.dataTransfer.files[0]);
        });

        els.fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFileSelect(e.target.files[0]);
        });

        els.btnRemoveFile.addEventListener('click', () => {
            currentFile = null;
            els.fileInfo.classList.add('hidden');
            els.fileInput.value = '';
        });

        // =====================================================================
        // Table Rendering
        // =====================================================================
        function renderTable(table, searchTerm = '') {
            const headers = table.headers || [];
            const rows = table.rows || [];

            let filteredRows = rows;
            let matchCount = 0;

            if (searchTerm) {
                const lower = searchTerm.toLowerCase();
                filteredRows = rows.filter(row =>
                    row.some(cell => String(cell).toLowerCase().includes(lower))
                );
                matchCount = filteredRows.length;
            }

            // Build table HTML
            let html = '<table class="preview-table"><thead><tr>';
            headers.forEach(h => {
                html += `<th>${escapeHtml(String(h))}</th>`;
            });
            html += '</tr></thead><tbody>';

            filteredRows.forEach(row => {
                html += '<tr>';
                row.forEach(cell => {
                    let cellStr = escapeHtml(String(cell));
                    if (searchTerm) {
                        cellStr = highlightMatch(cellStr, searchTerm);
                    }
                    html += `<td>${cellStr}</td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            els.tableContainer.innerHTML = html;

            // Info text
            els.tableInfoText.textContent = `${table.name} — ${formatNumber(table.row_count)} baris × ${table.col_count} kolom`;

            // Search result text
            if (searchTerm) {
                els.searchResultText.textContent = `${formatNumber(matchCount)} dari ${formatNumber(rows.length)} baris cocok`;
                els.searchResultText.classList.remove('hidden');
            } else {
                els.searchResultText.classList.add('hidden');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function highlightMatch(text, term) {
            const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<span class="highlight-match">$1</span>');
        }

        // =====================================================================
        // Tab Navigation
        // =====================================================================
        function renderTabs(tables) {
            els.tabNav.innerHTML = '';
            tables.forEach((table, i) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn px-4 py-2.5 text-sm font-medium whitespace-nowrap border-b-2 border-transparent
                                 text-gray-600 dark:text-gray-400 hover:text-brand-500 transition-colors duration-200 rounded-t-lg`;
                btn.textContent = table.name;
                btn.dataset.index = i;
                if (i === 0) btn.classList.add('active');

                btn.addEventListener('click', () => {
                    activeTabIndex = i;
                    $$('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderTable(tables[i], els.searchInput.value.trim());
                });

                els.tabNav.appendChild(btn);
            });
        }

        // =====================================================================
        // Search
        // =====================================================================
        let searchTimeout;
        els.searchInput.addEventListener('input', () => {
            const term = els.searchInput.value.trim();
            els.btnClearSearch.classList.toggle('hidden', !term);
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                if (resultData && resultData.tables[activeTabIndex]) {
                    renderTable(resultData.tables[activeTabIndex], term);
                }
            }, 200);
        });

        els.btnClearSearch.addEventListener('click', () => {
            els.searchInput.value = '';
            els.btnClearSearch.classList.add('hidden');
            els.searchResultText.classList.add('hidden');
            if (resultData && resultData.tables[activeTabIndex]) {
                renderTable(resultData.tables[activeTabIndex], '');
            }
        });

        // =====================================================================
        // Convert
        // =====================================================================
        async function convertFile() {
            if (!currentFile) return;

            const fileSizeStr = formatFileSize(currentFile.size);
            els.loadingDetail.textContent = `Menganalisis ${currentFile.name} (${fileSizeStr})...`;
            switchState('loading');

            const formData = new FormData();
            formData.append('file', currentFile);

            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || `Server error (${response.status})`);
                }

                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.detail || 'Konversi gagal');
                }

                resultData = data;
                activeTabIndex = 0;

                // Stats
                els.resultFilename.textContent = data.filename;
                els.statTables.textContent = `${data.tables_count} tabel`;

                const totalRows = data.tables.reduce((sum, t) => sum + t.row_count, 0);
                const totalCols = data.tables.reduce((max, t) => Math.max(max, t.col_count), 0);
                els.statRows.textContent = `${formatNumber(totalRows)} baris`;
                els.statCols.textContent = `${totalCols} kolom`;

                // Render tabs & first table
                renderTabs(data.tables);
                renderTable(data.tables[0]);

                switchState('result');
                lucide.createIcons({ nodes: [els.stateResult] });
                showToast(`Berhasil mengekstrak ${data.tables_count} tabel!`, 'success');

            } catch (err) {
                els.errorMessage.textContent = err.message;
                switchState('error');
                lucide.createIcons({ nodes: [els.stateError] });
            }
        }

        els.btnConvert.addEventListener('click', convertFile);

        // =====================================================================
        // Downloads
        // =====================================================================
        async function downloadFile(format) {
            if (!resultData) return;

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        filename: resultData.filename,
                        format: format,
                        tables: resultData.tables,
                    }),
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || 'Download gagal');
                }

                const blob = await response.blob();
                const disposition = response.headers.get('content-disposition') || '';
                const filenameMatch = disposition.match(/filename="?([^"]+)"?/);
                const downloadFilename = filenameMatch
                    ? filenameMatch[1]
                    : `${resultData.filename.replace(/\.[^.]+$/, '')}.${format}`;

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = downloadFilename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showToast(`File ${downloadFilename} berhasil diunduh`, 'success');

            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        els.btnDownloadXlsx.addEventListener('click', () => downloadFile('xlsx'));
        els.btnDownloadCsv.addEventListener('click', () => downloadFile('csv'));

        // =====================================================================
        // Copy to Clipboard (TSV)
        // =====================================================================
        els.btnCopyTsv.addEventListener('click', async () => {
            if (!resultData || !resultData.tables[activeTabIndex]) return;

            const table = resultData.tables[activeTabIndex];
            const headers = table.headers || [];
            const rows = table.rows || [];

            const lines = [headers.join('\t')];
            rows.forEach(row => lines.push(row.map(String).join('\t')));
            const tsv = lines.join('\n');

            try {
                await navigator.clipboard.writeText(tsv);
                showToast(`Tabel "${table.name}" disalin ke clipboard (TSV)`, 'success');

                // Visual feedback
                const copyBtn = els.btnCopyTsv;
                const originalHTML = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i><span>Disalin!</span>';
                lucide.createIcons({ nodes: [copyBtn] });
                setTimeout(() => {
                    copyBtn.innerHTML = originalHTML;
                    lucide.createIcons({ nodes: [copyBtn] });
                }, 2000);
            } catch {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = tsv;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast(`Tabel "${table.name}" disalin ke clipboard (TSV)`, 'success');
            }
        });

        // =====================================================================
        // Reset & Retry
        // =====================================================================
        els.btnReset.addEventListener('click', resetToIdle);
        els.btnRetry.addEventListener('click', resetToIdle);

        // =====================================================================
        // Initialize
        // =====================================================================
        lucide.createIcons();
    </script>
</body>
</html>

version: '3.8'

services:
  table-extractor:
    build: .
    container_name: table-extractor-app
    restart: always
    ports:
      - "3022:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    env_file:
      - path: .env
        required: false
